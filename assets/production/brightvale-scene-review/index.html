<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brightvale — assembled browser review</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          14px/1.5 ui-monospace,
          monospace;
        background: #0d1220;
        color: #e6e4ef;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        width: min(1600px, 100vw);
        margin: 0 auto;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        background: #111a2b;
      }
      pre {
        margin: 0;
        padding: 1rem;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas
        id="view"
        width="1600"
        height="900"
        aria-label="Brightvale assembled scene review"
      ></canvas>
      <pre id="report" data-state="loading">
Loading the assembled Brightvale study…</pre>
      <pre id="evidence" hidden></pre>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
