name: Pull request checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pull-request-checks:
    name: Pull request checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        # actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Python 3.14
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install locked npm dependencies
        run: npm ci

      - name: Run Vitest suite
        run: npm test -- --exclude src/main.integration.test.ts

      - name: Run Brightvale harness unit tests (no browser)
        run: node --test tests/browser/brightvale/*.test.mjs

      - name: Test production asset-path validation
        run: npm run test:production-subpath

      - name: Run chart Python tests
        run: npm run test:chart

      - name: Verify generated chart caches
        run: npm run chart:check

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Validate production asset paths
        run: npm run validate:production-subpath

      - name: Upload validated Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        # actions/upload-pages-artifact v5
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy-pages:
    name: Deploy GitHub Pages
    needs: pull-request-checks
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        # actions/deploy-pages v5.0.1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
