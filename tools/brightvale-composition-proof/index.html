<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brightvale composition proof</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #080d16;
      }
      body {
        display: grid;
        place-items: center;
      }
      #stage {
        position: relative;
        width: min(100vw, 1600px);
        aspect-ratio: 16 / 9;
        background: #0b1220;
        overflow: hidden;
      }
      #view {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        pointer-events: none;
      }
      .bar {
        min-height: 54px;
        padding: 0 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(7, 12, 22, 0.92);
        border-color: rgba(152, 179, 218, 0.15);
      }
      .bar.top {
        border-bottom: 1px solid rgba(152, 179, 218, 0.2);
      }
      .bar.bottom {
        min-height: 68px;
        border-top: 1px solid rgba(152, 179, 218, 0.2);
        color: #98a7c1;
      }
      .brand {
        color: #f0dfc5;
        font-size: 13px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 700;
      }
      .mode {
        color: #f4bb70;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .twilight .mode {
        color: #b9a3ff;
      }
      .meta {
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      #report,
      #capture {
        display: none;
      }
      body[data-state='failed']::after {
        content: 'Proof failed — see report';
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: white;
        background: #8b1d2c;
        font: 700 20px system-ui;
      }
      @media (max-width: 700px) {
        #stage {
          width: 100vw;
        }
        .bar {
          padding-inline: 12px;
          min-height: 42px;
        }
        .bar.bottom {
          min-height: 48px;
        }
        .brand {
          font-size: 10px;
        }
        .meta {
          font-size: 8px;
        }
      }
    </style>
  </head>
  <body>
    <main id="stage">
      <canvas id="view"></canvas>
      <div id="hud">
        <header class="bar top">
          <span class="brand">✦ Brightvale</span
          ><span class="mode" id="mode">Audience</span>
        </header>
        <footer class="bar bottom">
          <span class="meta">Four-lane rhythm world</span
          ><span class="meta" id="resolution"></span>
        </footer>
      </div>
    </main>
    <pre id="report" data-state="loading"></pre>
    <pre id="capture"></pre>
    <script type="module" src="./main.js"></script>
  </body>
</html>
