<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brightvale playfield geometry proof</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #090e19;
        color: #ecf1f8;
        font:
          14px/1.45 ui-monospace,
          monospace;
      }
      main {
        width: min(1600px, 100vw);
        margin: auto;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        background: #111a2b;
      }
      pre {
        margin: 0;
        padding: 12px 16px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #legend {
        position: fixed;
        right: 18px;
        top: 18px;
        padding: 10px 14px;
        border: 1px solid #63718b;
        background: #101a2dde;
        color: #f5e6c8;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas
        id="view"
        aria-label="Measured Brightvale playfield proof"
      ></canvas>
      <pre id="report" data-state="loading">Loading production geometry…</pre>
      <pre id="capture" hidden></pre>
    </main>
    <aside id="legend">
      D · F · J · K &nbsp; / &nbsp; HIT<br />Measured 42-unit path · geometry
      rays
    </aside>
    <script type="module" src="./main.js"></script>
  </body>
</html>
